<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Gimmi – balíčky a ceny</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400&display=swap">
<link rel="stylesheet" href="pitch.css">
<style>
body { background: #F7F4EE; padding-top: 56px; }
.page { padding-block: clamp(28px, 5vw, 56px) 80px; display: grid; gap: 28px; }
.page h1 { font-size: clamp(32px, 4vw, 44px); }
.layout { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.left { flex: 999 1 560px; min-width: 0; display: grid; gap: 24px; }

.plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 860px) { .plans { grid-template-columns: minmax(0, 1fr); } }
.plan { text-align: left; display: grid; gap: 14px; align-content: start; padding: 20px; background: #fff; border: 1.5px solid #E7E1D4; border-radius: 14px; color: var(--ink); font: inherit; cursor: pointer; transition: border-color .2s ease, box-shadow .2s ease; }
.plan:hover { border-color: #CFC6B2; }
.plan[aria-pressed="true"] { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.plan .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.plan .name { font-size: 17px; font-weight: 600; }
.plan .radio { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #CFC6B2; display: grid; place-items: center; }
.plan[aria-pressed="true"] .radio { border-color: var(--green); background: var(--green); }
.plan[aria-pressed="true"] .radio::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fff; }
.plan .price { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.plan .price small { font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.plan ul { list-style: none; margin: 0; padding: 14px 0 0; border-top: 1px solid #EFEAE0; display: grid; gap: 10px; }
.plan li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; font-size: 14.5px; line-height: 1.35; }
.ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--green-soft); color: var(--green-ink); }
.ico svg { width: 17px; height: 17px; }
.plan li.inherit { color: var(--muted); }
.plan li.inherit .ico { background: #F1ECE2; color: var(--muted); }

.extras { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.extra { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #fff; border: 1px solid #E7E1D4; border-radius: 12px; cursor: pointer; }
.extra input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.extra .t { flex: 1 1 auto; min-width: 0; display: grid; gap: 2px; font-size: 14.5px; font-weight: 600; }
.extra .t span { font-size: 13.5px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.sw { flex: none; width: 40px; height: 24px; border-radius: 999px; background: #DDD5C4; position: relative; transition: background .2s ease; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s ease; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.extra input:checked ~ .sw { background: var(--green); }
.extra input:checked ~ .sw::after { transform: translateX(16px); }
.extra input:focus-visible ~ .sw { outline: 2px solid var(--terra-2); outline-offset: 3px; }
.extra.locked { opacity: .5; cursor: not-allowed; }

.care { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 16px 18px; background: #fff; border: 1px solid #E7E1D4; border-radius: 12px; }
.care .lbl { font-size: 14.5px; font-weight: 600; }
.care .pts { display: flex; flex-wrap: wrap; gap: 10px 18px; flex: 1 1 360px; min-width: 0; }
.care .pt { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
.care .pt .ico { width: 26px; height: 26px; border-radius: 7px; }
.care .pt .ico svg { width: 15px; height: 15px; }
.care .yr { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

.sum { flex: 1 1 280px; min-width: 0; position: sticky; top: calc(20px + env(safe-area-inset-top, 0px)); background: #fff; border: 1px solid #E7E1D4; border-radius: 14px; padding: 20px; display: grid; gap: 12px; }
.sum .line { display: flex; justify-content: space-between; gap: 12px; font-size: 14.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.sum .line.minus span:last-child { color: var(--terra); }
.sum .total { display: grid; gap: 2px; padding-top: 12px; border-top: 1px solid #EFEAE0; }
.sum .total span { font-size: 13.5px; color: var(--muted); }
.sum .total b { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; font-variant-numeric: tabular-nums; color: var(--green-ink); }
.sum .yr { font-size: 14px; color: var(--ink-2); }
.sum .yr b { font-variant-numeric: tabular-nums; }
.sum textarea { width: 100%; min-height: 130px; resize: vertical; padding: 10px 12px; border-radius: 8px; border: 1px solid #E7E1D4; font: 13.5px/1.5 var(--body); color: var(--ink); background: #FBF9F5; }
.note { font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
<main class="wrap page">
<h1>Balíčky a ceny</h1>

<div class="layout">
<div class="left">
<div class="plans" role="group" aria-label="Výběr balíčku" id="plans"></div>
<div class="extras" id="extras"></div>
<div class="care" aria-label="Provoz a péče">
<span class="lbl">Provoz a péče</span>
<span class="pts" id="care-pts"></span>
<span class="yr">2&nbsp;880&nbsp;Kč ročně</span>
</div>
</div>

<aside class="sum" aria-live="polite" aria-label="Souhrn">
<div id="s-lines" style="display: grid; gap: 8px;"></div>
<div class="total"><span>Celkem jednorázově</span><b id="s-total">0</b></div>
<p class="yr">+ provoz a péče <b>2&nbsp;880&nbsp;Kč ročně</b></p>
<button type="button" class="btn primary" id="want">Mám zájem</button>
<div id="send" hidden style="display: grid; gap: 8px;">
<label for="send-text" class="note">Shrnutí k odeslání:</label>
<textarea id="send-text" readonly></textarea>
<button type="button" class="btn small" id="copy">Zkopírovat</button>
</div>
<p class="note">Orientační ceny, finální potvrdím po doladění.</p>
</aside>
</div>
</main>

<script>
(function () {
  'use strict';
  var SLEVA = 0.2;                 // sleva pro Gimmi (0 = bez slevy)
  var SLEVA_POPIS = 'Sleva pro Gimmi −20\u00a0%';

  var I = {
    laptop: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/>',
    book: '<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>',
    insta: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/>',
    pin: '<path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
    phone: '<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>',
    globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
    pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    cake: '<path d="M4 21h16v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2z"/><path d="M4 16c2 1.5 4 1.5 5 0 1 1.5 3 1.5 4 0 1 1.5 3 1.5 4 0 1 1.5 2 1.5 3 0"/><path d="M12 11V7"/><path d="M12 4v.01"/>',
    sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4"/>',
    bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/>',
    cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    calcheck: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="m9 16 2 2 4-4"/>',
    gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v9H5v-9"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
    image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    server: '<rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
  };
  function ic(n) { return '<span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + I[n] + '</svg></span>'; }

  var plans = [
    { id: 'zaklad', name: 'Základ', price: 14000, items: [
      ['laptop', 'Nový web podle návrhu'], ['book', 'Menu přímo na webu'], ['insta', 'Galerie z Instagramu'],
      ['pin', 'Mapa a kontakt'], ['phone', 'Funguje na mobilu'], ['pen', 'Logo ve vektoru'], ['globe', 'Spuštění na gimmicafe.cz'] ] },
    { id: 'doporuceny', name: 'Doporučený', price: 22000, items: [
      ['plus', 'Vše ze Základu', 1], ['cake', 'Vitrína sama z Instagramu'], ['sliders', 'Administrace menu a otevírací doby'],
      ['bell', 'Oznámení na webu'], ['cal', 'Rezervační formulář'] ] },
    { id: 'kompletni', name: 'Kompletní', price: 28000, items: [
      ['plus', 'Vše z Doporučeného', 1], ['gift', 'Dárkové poukazy'], ['calcheck', 'Správa rezervací'],
      ['image', 'Správa fotek a galerie'], ['users', 'Zaškolení v kavárně'] ] }
  ];
  var extras = [
    { id: 'poukazy', name: 'Dárkové poukazy', price: 4800, included: 'kompletni' },
    { id: 'rezervace', name: 'Správa rezervací', price: 2400, needs: 'doporuceny', included: 'kompletni' }
  ];
  var rank = { zaklad: 0, doporuceny: 1, kompletni: 2 };
  var state = { plan: 'doporuceny', add: {} };
  try { var sv = JSON.parse(localStorage.getItem('gimmi-vyber2') || 'null'); if (sv && sv.plan) state = sv; } catch (e) {}
  var fmt = function (n) { return Math.round(n).toLocaleString('cs-CZ') + ' Kč'; };

  document.getElementById('care-pts').innerHTML =
    '<span class="pt">' + ic('server') + 'Hosting a zálohy</span>' +
    '<span class="pt">' + ic('clock') + 'Úpravy do 3 pracovních dnů</span>' +
    '<span class="pt">' + ic('insta') + 'Hlídání Instagramu</span>';

  function render() {
    document.getElementById('plans').innerHTML = plans.map(function (p) {
      return '<button type="button" class="plan" data-plan="' + p.id + '" aria-pressed="' + (p.id === state.plan) + '">' +
        '<span class="top"><span class="name">' + p.name + '</span><span class="radio" aria-hidden="true"></span></span>' +
        '<span class="price">' + p.price.toLocaleString('cs-CZ') + ' <small>Kč</small></span>' +
        '<ul>' + p.items.map(function (it) { return '<li' + (it[2] ? ' class="inherit"' : '') + '>' + ic(it[0]) + '<span>' + it[1] + '</span></li>'; }).join('') + '</ul></button>';
    }).join('');
    document.getElementById('extras').innerHTML = extras.map(function (a) {
      var locked = a.needs && rank[state.plan] < rank[a.needs];
      var incl = a.included === state.plan;
      var on = incl || (!!state.add[a.id] && !locked);
      return '<label class="extra' + (locked ? ' locked' : '') + '" for="x-' + a.id + '">' + ic(a.id === 'poukazy' ? 'gift' : 'calcheck') +
        '<input type="checkbox" id="x-' + a.id + '" data-x="' + a.id + '"' + (on ? ' checked' : '') + (locked || incl ? ' disabled' : '') + '>' +
        '<span class="t">' + a.name + '<span>' + (incl ? 'v ceně balíčku' : locked ? 'od balíčku Doporučený' : '+ ' + fmt(a.price)) + '</span></span>' +
        '<span class="sw" aria-hidden="true"></span></label>';
    }).join('');
    var p = plans.filter(function (x) { return x.id === state.plan; })[0];
    var lines = [[p.name, p.price]];
    extras.forEach(function (a) {
      var locked = a.needs && rank[state.plan] < rank[a.needs];
      if (a.included === state.plan || locked || !state.add[a.id]) return;
      lines.push([a.name, a.price]);
    });
    var sum = lines.reduce(function (s, l) { return s + l[1]; }, 0);
    var disc = Math.round(sum * SLEVA / 100) * 100;
    document.getElementById('s-lines').innerHTML = lines.map(function (l) { return '<div class="line"><span>' + l[0] + '</span><span>' + fmt(l[1]) + '</span></div>'; }).join('') +
      (disc ? '<div class="line minus"><span>' + SLEVA_POPIS + '</span><span>−' + fmt(disc) + '</span></div>' : '');
    document.getElementById('s-total').textContent = fmt(sum - disc);
    document.getElementById('send-text').value = ('Dobrý den, mám zájem o web pro Gimmi:\n' +
      lines.map(function (l) { return '• ' + l[0] + ': ' + fmt(l[1]); }).join('\n') +
      (disc ? '\n• ' + SLEVA_POPIS + ': −' + fmt(disc) : '') +
      '\nCelkem jednorázově: ' + fmt(sum - disc) + '\nProvoz a péče: 2 880 Kč ročně').replace(/ /g, ' ');
  }
  function save() { try { localStorage.setItem('gimmi-vyber2', JSON.stringify(state)); } catch (e) {} }
  document.getElementById('plans').addEventListener('click', function (e) {
    var b = e.target.closest('[data-plan]'); if (!b) return; state.plan = b.dataset.plan; save(); render();
  });
  document.getElementById('extras').addEventListener('change', function (e) {
    var c = e.target.closest('[data-x]'); if (!c) return; state.add[c.dataset.x] = c.checked; save(); render();
  });
  document.getElementById('want').addEventListener('click', function () { var s = document.getElementById('send'); s.hidden = !s.hidden; });
  document.getElementById('copy').addEventListener('click', function () {
    var ta = document.getElementById('send-text'), b = this;
    try { navigator.clipboard.writeText(ta.value).then(function () { b.textContent = 'Zkopírováno'; setTimeout(function () { b.textContent = 'Zkopírovat'; }, 1600); }, function () { ta.select(); }); } catch (e) { ta.select(); }
  });
  render();
})();
</script>
<a class="pitch-back" href="index.html" aria-label="Zpět na přehled" title="Zpět na přehled"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
<style>.pitch-back{position:fixed;z-index:60;left:max(12px,env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:#2A211B;color:#FBF8F1;text-decoration:none;box-shadow:0 10px 24px -12px rgba(42,33,27,.6);transition:background-color .2s ease}.pitch-back:hover{background:#707A48;color:#fff}.pitch-back:focus-visible{outline:2px solid #B5562E;outline-offset:3px}</style>
</body>
</html>
