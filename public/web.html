<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Gimmi – návrh webu</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,400&amp;family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&amp;family=Pinyon+Script&amp;family=Sacramento&amp;display=swap">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#F5EFE3}
section{scroll-margin-top:84px}
a{color:#5A5C26}a:hover{color:#2A211B}
.g-nav a{color:#2A211B;text-decoration:none}
.g-nav a:hover{color:#9A4524}
.g-btn{transition:transform .15s ease,box-shadow .15s ease}
.g-btn:hover{transform:translateY(-1px);box-shadow:0 12px 22px -14px rgba(42,33,27,.6)}
.g-tile .g-frame{transition:transform .25s ease}
.g-tile:hover .g-frame{transform:translateY(-4px) rotate(-.5deg)}
.g-field:focus{outline:2px solid #B5562E;outline-offset:1px}
.g-arrow:disabled{opacity:.35;cursor:default}
.g-navlink{position:relative;display:inline-block;padding:12px 0;transition:color .3s ease}
.g-navlink::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:2px;border-radius:2px;background:#707A48;transform:scaleX(0);transform-origin:left center;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.g-navlink:hover::after{transform:scaleX(.35)}
.g-nav a.g-navlink[aria-current="true"]{color:#5A5C26}
.g-navlink[aria-current="true"]::after{transform:scaleX(1)}
.g-tab{transition:background-color .2s ease,border-color .2s ease,transform .2s ease}
.g-tab[aria-pressed="false"]:hover{background:#EFE7D6 !important;border-color:#8C7F6A !important;transform:translateY(-1px)}
.g-thumb span:first-child{transition:transform .25s ease,box-shadow .25s ease,opacity .25s ease}
.g-thumb:hover span:first-child{transform:translateY(-3px);opacity:1 !important}
@keyframes g-sway{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}
@keyframes g-flicker{0%,100%{opacity:1}40%{opacity:.78}55%{opacity:.95}70%{opacity:.85}}
.g-lustr{transform-origin:50% 0;animation:g-sway 6s ease-in-out infinite}
.g-lustr:hover{animation-duration:2.6s}
.g-lustr:focus-visible{outline:2px solid #B5562E;outline-offset:6px;border-radius:12px}
.g-flame{animation:g-flicker 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.g-lustr,.g-flame{animation:none}}
.g-navwrap{order:3;flex-basis:100%;overflow-x:auto}
.g-cta{order:2;margin-left:auto}
@media (min-width:1040px){.g-navwrap{order:2;flex-basis:auto;margin:0 auto;overflow:visible}.g-cta{order:3;margin-left:0}}
@media (max-width:520px){.g-hide-xs{display:none}}
</style>

</head>
<body>
<div id="app"></div>
<template id="tpl">
<div id="top" style="--acc: {{accFamily}}; --accst: {{accStyle}}; --accs: {{accScale}}; font-family: 'DM Sans', system-ui, -apple-system, sans-serif; font-size: 17px; line-height: 1.6; color: #2A211B; background: #F5EFE3; min-width: 0; overflow-x: clip;">

<header style="position: sticky; top: 0; z-index: 40; background: rgba(245, 239, 227, 0.94); backdrop-filter: blur(10px); border-bottom: 1px solid #E3D9C4;">
<div style="max-width: 1200px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 40px); display: flex; flex-wrap: wrap; align-items: center; column-gap: 28px; row-gap: 0px;">
<a href="#top" aria-label="Gimmi lounge café – na začátek stránky" style="order: 1; display: inline-flex; align-items: center; min-height: 52px; color: #2A211B; text-decoration: none;"><svg viewBox="0 0 264 168" width="72" height="46" aria-hidden="true"><path d="M86 16A30 30 0 0 0 86 76Z" fill="#B5562E"></path><path d="M86 16A30 30 0 0 1 86 76Z" fill="#707A48"></path><rect x="82.5" y="14" width="7" height="106" fill="#2A211B"></rect><text x="18" y="120" font-family="'DM Sans', 'Segoe UI', system-ui, sans-serif" font-size="66" font-weight="400" fill="#2A211B" textLength="52" lengthAdjust="spacingAndGlyphs">G</text><text x="99" y="120" font-family="'DM Sans', 'Segoe UI', system-ui, sans-serif" font-size="66" font-weight="400" fill="#2A211B" textLength="150" lengthAdjust="spacingAndGlyphs">MMI</text><text x="14" y="158" font-family="'DM Sans', 'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="400" fill="#5A5C26" textLength="234" lengthAdjust="spacingAndGlyphs">lounge cafe</text></svg></a>
<nav aria-label="Hlavní navigace" class="g-navwrap g-nav">
<div style="display: flex; gap: 22px; white-space: nowrap; font-size: 15px; font-weight: 500;">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
<a href="{{n.href}}" onClick="{{n.go}}" class="g-navlink" aria-current="{{n.cur}}">{{n.label}}</a>
</sc-for>
</div>
</nav>
<div class="g-cta" style="display: flex; align-items: center; gap: 14px;">
<span class="g-hide-xs" style="display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 500; color: #4E433A;"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{statusDot}};"></span>{{statusShort}}</span>
<sc-if value="{{showReservation}}" hint-placeholder-val="{{ true }}">
<a href="#rezervace" class="g-btn" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #707A48; color: #FFFFFF; font-size: 14.5px; font-weight: 600; text-decoration: none;">Rezervace</a>
</sc-if>
</div>
</div>
</header>

<main>

<section id="uvod" aria-labelledby="hero-h" style="padding: clamp(28px, 4vw, 64px) 0 clamp(44px, 6vw, 80px);">
<div style="max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); display: flex; flex-wrap: wrap; align-items: center; gap: clamp(40px, 6vw, 80px);">
<div style="flex: 1 1 420px; min-width: 0; max-width: 620px;">
<svg viewBox="0 0 120 40" width="96" height="32" fill="none" stroke="#8C8A48" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 32C40 28 80 20 116 8"></path><path d="M28 28c-3-9 2-17 12-19 1 9-3 16-12 19Z"></path><path d="M30 28c7 5 16 6 22 2-6-7-15-7-22-2Z"></path><path d="M60 22c-2-9 4-15 14-16 0 9-6 15-14 16Z"></path><path d="M62 22c7 5 16 5 22 0-7-6-15-6-22 0Z"></path><path d="M92 14c0-8 6-12 14-11-1 8-7 11-14 11Z"></path></svg>
<p style="margin: 10px 0 0; font-size: 12.5px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #9A4524;">Na Slovanském náměstí od roku 2007</p>
<h1 id="hero-h" style="margin: 16px 0 0; font-family: 'Fraunces', Georgia, serif; font-weight: 400; font-size: clamp(44px, 6vw, 84px); line-height: 0.98; letter-spacing: -0.025em; color: #2A211B;">{{greeting}} z&nbsp;Gimmi</h1>
<p style="margin: 26px 0 0; max-width: 34em; font-size: clamp(17px, 1.6vw, 20px); line-height: 1.6; color: #4E433A;">Stylová kavárna s&nbsp;výběrovou kávou v&nbsp;Králově Poli. Snídaně po celý den, dezerty z&nbsp;vlastní výroby a&nbsp;dvě patra plná starých křesel a&nbsp;obrazů.</p>
<div style="margin-top: 34px; display: flex; flex-wrap: wrap; gap: 12px;">
<a href="#dnes" class="g-btn" style="display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 26px; border-radius: 999px; background: #707A48; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none;">Co je dnes ve vitríně<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
<a href="#menu" class="g-btn" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; border-radius: 999px; border: 1px solid #2A211B; color: #2A211B; font-size: 16px; font-weight: 600; text-decoration: none;">Prohlédnout menu</a>
</div>

</div>
<div style="flex: 1 1 460px; min-width: 0;">
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(14px, 1.8vw, 24px); align-items: start;">
<figure style="margin: 0; grid-column: span 3; grid-row: span 2;">
<div style="padding: 7px; background: linear-gradient(135deg, #D2B477 0%, #8C6A3A 38%, #E0C891 55%, #8C6A3A 80%, #C7A465 100%); box-shadow: 0 24px 40px -24px rgba(42, 33, 27, 0.6);">
<div style="padding: clamp(8px, 1.4vw, 18px); background: #FBF8F1; box-shadow: inset 0 0 0 1px rgba(140, 106, 58, 0.35);">
<div style="aspect-ratio: 4 / 5; overflow: hidden; background: #E6DCC7;"><img src="img/hero-tartaletky.jpg" alt="Pistáciové tartaletky s jahodami na talíři před starým obrazem v kavárně" style="display: block; width: 100%; height: 100%; object-fit: cover;"></div>
</div>
</div>
<figcaption style="margin-top: 14px; display: inline-flex; flex-direction: column; gap: 3px; max-width: 100%; padding: 8px 12px 9px; background: #FBF8F1; border: 1px solid #E3D9C4; box-shadow: 0 1px 2px rgba(42, 33, 27, 0.06);">
<span style="font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 15px; line-height: 1.3; color: #2A211B;">Tartaletky před obrazem</span>
<span style="font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #6B5E52;">Vitrína &amp; galerie</span>
</figcaption>
</figure>
<figure style="margin: clamp(24px, 4vw, 56px) 0 0; grid-column: span 2;">
<div style="padding: 6px; background: #3B2B20; box-shadow: 0 24px 40px -24px rgba(42, 33, 27, 0.55);">
<div style="padding: clamp(6px, 1vw, 12px); background: #FBF8F1; box-shadow: inset 0 0 0 1px #B39257;">
<div style="aspect-ratio: 1 / 1; overflow: hidden; background: #E6DCC7;"><img src="img/hero-kava.jpg" alt="Cappuccino, dort s ostružinami, croissanty a balíček kávy Oh My Bean" style="display: block; width: 100%; height: 100%; object-fit: cover;"></div>
</div>
</div>
<figcaption style="margin-top: 12px; display: inline-flex; flex-direction: column; gap: 3px; max-width: 100%; padding: 7px 11px 8px; background: #FBF8F1; border: 1px solid #E3D9C4; box-shadow: 0 1px 2px rgba(42, 33, 27, 0.06);">
<span style="font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 14.5px; line-height: 1.3; color: #2A211B;">Káva od Oh My Bean</span>
<span style="font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #6B5E52;">Mlýnek 2</span>
</figcaption>
</figure>
<figure style="margin: 0; grid-column: span 2;">
<div style="padding: 6px; background: #3B2B20; box-shadow: 0 24px 40px -24px rgba(42, 33, 27, 0.55);">
<div style="padding: clamp(6px, 1vw, 12px); background: #FBF8F1; box-shadow: inset 0 0 0 1px #B39257;">
<div style="aspect-ratio: 4 / 5; overflow: hidden; background: #E6DCC7;"><img src="img/hero-buchty.jpg" alt="Talíř čerstvých loupáčků, v pozadí křeslo a knihovna" style="display: block; width: 100%; height: 100%; object-fit: cover;"></div>
</div>
</div>
<figcaption style="margin-top: 12px; display: inline-flex; flex-direction: column; gap: 3px; max-width: 100%; padding: 7px 11px 8px; background: #FBF8F1; border: 1px solid #E3D9C4; box-shadow: 0 1px 2px rgba(42, 33, 27, 0.06);">
<span style="font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 14.5px; line-height: 1.3; color: #2A211B;">Páteční loupáčky</span>
<span style="font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #6B5E52;">Ráno na baru</span>
</figcaption>
</figure>
</div>
</div>
</div>
</section>

<section id="dnes" aria-labelledby="dnes-h" style="background: #707A48; color: #FFFFFF; padding: clamp(44px, 5vw, 72px) 0;">
<div style="max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); display: flex; flex-wrap: wrap; align-items: flex-start; gap: clamp(32px, 4vw, 64px);">
<figure style="margin: 0; flex: 1 1 300px; max-width: 380px; min-width: 0;">
<div style="padding: 7px; background: linear-gradient(135deg, #D2B477 0%, #8C6A3A 38%, #E0C891 55%, #8C6A3A 80%, #C7A465 100%); box-shadow: 0 30px 50px -28px rgba(0, 0, 0, 0.7);">
<div style="padding: clamp(8px, 1.4vw, 18px); background: #FBF8F1; box-shadow: inset 0 0 0 1px rgba(140, 106, 58, 0.35);">
<div style="aspect-ratio: 4 / 5; overflow: hidden; background: #E6DCC7;"><img src="{{post.img}}" alt="{{post.alt}}" style="display: block; width: 100%; height: 100%; object-fit: cover;"></div>
</div>
</div>
<figcaption style="margin-top: 16px; display: inline-flex; flex-direction: column; gap: 3px; max-width: 100%; padding: 8px 12px 9px; background: #FBF8F1; border: 1px solid #E3D9C4; color: #2A211B;">
<span style="font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #6B5E52;">Instagram · {{post.date}}</span>
</figcaption>
</figure>
<div style="flex: 1 1 400px; min-width: 0;">
<p style="margin: 0; font-family: var(--acc); font-style: var(--accst); font-weight: 400; font-size: calc(clamp(34px, 3.6vw, 46px) * var(--accs)); line-height: 1.05; color: #FFE6CF;">{{vitrineKicker}}</p>
<h2 id="dnes-h" style="margin: 10px 0 0; font-family: 'Fraunces', Georgia, serif; font-weight: 400; font-size: clamp(30px, 3.4vw, 44px); line-height: 1.06; letter-spacing: -0.015em;">{{post.intro}}</h2>
<ul style="list-style: none; margin: 24px 0 0; padding: 0; min-height: 212px; display: flex; flex-direction: column; gap: 10px;">
<sc-for list="{{post.items}}" as="it" hint-placeholder-count="4">
<li style="display: flex; align-items: flex-start; gap: 14px; font-family: 'Fraunces', Georgia, serif; font-size: clamp(20px, 2vw, 25px); line-height: 1.3;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#FFE6CF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 0.3em;"><path d="M12 20s-7-4.4-7-9.6A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.4C19 15.6 12 20 12 20Z"></path></svg><span>{{it}}</span></li>
</sc-for>
</ul>
<p style="margin: 30px 0 0; display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 12px 22px; border: 1px solid rgba(245, 239, 227, 0.32); border-radius: 999px;"><span style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #F6F3E8;">Polévka</span><span style="font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 20px; line-height: 1.3;">{{post.soup}}</span></p>
<div style="margin-top: 28px;">
<p style="margin: 0 0 12px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #F6F3E8;">Tento a minulé týdny</p>
<div style="display: flex; flex-wrap: wrap; gap: 14px;">
<sc-for list="{{pills}}" as="pill" hint-placeholder-count="4">
<button type="button" class="g-thumb" onClick="{{pill.pick}}" aria-pressed="{{pill.on}}" aria-label="Nabídka {{pill.label}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; color: #FFFFFF; cursor: pointer; font-family: 'DM Sans', sans-serif;"><span style="display: block; width: 60px; height: 60px; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 2px {{pill.ring}}; opacity: {{pill.op}};"><img src="{{pill.img}}" alt="" style="display: block; width: 100%; height: 100%; object-fit: cover;"></span><span style="font-size: 12.5px; font-weight: 600; white-space: nowrap;">{{pill.label}}</span></button>
</sc-for>
</div>
</div>
<a href="{{post.url}}" target="_blank" rel="noopener" style="margin-top: 22px; display: inline-flex; align-items: center; gap: 10px; min-height: 44px; color: #F5EFE3; font-weight: 600; text-decoration: underline; text-underline-offset: 5px; text-decoration-color: rgba(245, 239, 227, 0.45);"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.3" cy="6.7" r="0.6" fill="currentColor"></circle></svg>Celý příspěvek na Instagramu</a>
</div>
</div>
</section>

<section id="kava" aria-labelledby="kava-h" style="padding: clamp(44px, 5vw, 72px) 0;">
<div style="max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px);">
<div style="max-width: 720px; margin: 0 auto; text-align: center;">
<p style="margin: 0; font-size: 12.5px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #9A4524;">Mlýnek 1 · Mlýnek 2</p>
<h2 id="kava-h" style="margin: 12px 0 0; font-family: 'Fraunces', Georgia, serif; font-weight: 400; font-size: clamp(32px, 3.8vw, 48px); line-height: 1.05; letter-spacing: -0.015em;">Dva mlýnky, dvě kávy</h2>
<p style="margin: 18px auto 0; max-width: 36em; font-size: 18px; line-height: 1.65; color: #4E433A;">U&nbsp;nás si vybere tu svoji každý. Na jednom mlýnku máme klasiku pro milovníky italského espressa, na druhém výběrovou kávu z&nbsp;českých pražíren.</p>
</div>
<div style="margin-top: 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 32px;">
<article style="flex: 1 1 300px; max-width: 400px; min-width: 0; background: #FBF8F1; border: 1px solid #E3D9C4; border-top: 4px solid #B5562E; padding: clamp(24px, 3vw, 34px);">
<p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #9A4524;">Mlýnek 1</p>
<h3 style="margin: 10px 0 0; font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 30px; line-height: 1.15;">Bar speciale</h3>
<p style="margin: 12px 0 0; font-size: 16px; line-height: 1.6; color: #4E433A;">Arabica s&nbsp;robustou v&nbsp;poměru 80/20, italsky tmavě pražená, bez kyselosti.</p>
<p style="margin: 18px 0 0; display: flex; flex-wrap: wrap; gap: 8px;"><span style="display: inline-flex; align-items: center; min-height: 30px; padding: 4px 12px; border-radius: 999px; background: #EBE3D2; font-size: 13px; font-weight: 500; color: #4E433A;">z&nbsp;8–9&nbsp;g kávy</span><span style="display: inline-flex; align-items: center; min-height: 30px; padding: 4px 12px; border-radius: 999px; background: #EBE3D2; font-size: 13px; font-weight: 500; color: #4E433A;">pro milovníky klasiky</span></p>
</article>
<div style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px;">
<svg viewBox="0 0 100 104" width="150" height="156" role="img" aria-label="Kruh z loga Gimmi ze dvou půlek – mlýnek 1 a mlýnek 2"><path d="M50 12A40 40 0 0 0 50 92Z" fill="#B5562E"></path><path d="M50 12A40 40 0 0 1 50 92Z" fill="#707A48"></path><rect x="47.5" y="4" width="5" height="96" fill="#2A211B"></rect><text x="31" y="58" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="17" fill="#FBF8F1">1</text><text x="69" y="58" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="17" fill="#FBF8F1">2</text></svg>
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #6B5E52;">Espresso 62&nbsp;Kč</span>
</div>
<article style="flex: 1 1 300px; max-width: 400px; min-width: 0; background: #FBF8F1; border: 1px solid #E3D9C4; border-top: 4px solid #5A5C26; padding: clamp(24px, 3vw, 34px);">
<p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #5A5C26;">Mlýnek 2 · doporučujeme</p>
<h3 style="margin: 10px 0 0; font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 30px; line-height: 1.15;">Výběrová káva</h3>
<p style="margin: 12px 0 0; font-size: 16px; line-height: 1.6; color: #4E433A;">100% arabica z&nbsp;výběrových exkluzivních káv, čerstvě z&nbsp;českých pražíren. Obměňujeme ji podle nabídky.</p>
<p style="margin: 18px 0 0; display: flex; flex-wrap: wrap; gap: 8px;"><span style="display: inline-flex; align-items: center; min-height: 30px; padding: 4px 12px; border-radius: 999px; background: #EBE3D2; font-size: 13px; font-weight: 500; color: #4E433A;">z&nbsp;9–10&nbsp;g kávy</span><span style="display: inline-flex; align-items: center; min-height: 30px; padding: 4px 12px; border-radius: 999px; background: #5A5C26; font-size: 13px; font-weight: 600; color: #FBF8F1;">teď na mlýnku: Peru · Oh My Bean</span></p>
</article>
</div>

<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'snidane', post: 0, guests: 2, sent: false, dez: 0, lit: true, sec: null };
  }

  componentDidMount() {
    this.clock = setInterval(() => this.forceUpdate(), 60000);
    this.spyTimer = setTimeout(() => {
      if (typeof IntersectionObserver === 'undefined') return;
      const ids = ['uvod', 'dnes', 'kava', 'menu', 'dezerty', 'kavarna', 'galerie', 'kontakt'];
      this.spy = new IntersectionObserver((entries) => {
        entries.forEach((en) => {
          if (en.isIntersecting && en.target.id !== this.state.sec) this.setState({ sec: en.target.id });
        });
      }, { rootMargin: '-35% 0px -60% 0px' });
      ids.forEach((id) => {
        const el = document.getElementById(id);
        if (el) this.spy.observe(el);
      });
    }, 400);
  }

  componentWillUnmount() {
    if (this.clock) clearInterval(this.clock);
    if (this.spyTimer) clearTimeout(this.spyTimer);
    if (this.spy) this.spy.disconnect();
  }

  prague() {
    const now = new Date();
    try {
      const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Prague', weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(now);
      const get = (type) => {
        const part = parts.find((x) => x.type === type);
        return part ? part.value : '';
      };
      const days = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
      const day = days[get('weekday')];
      const mins = parseInt(get('hour'), 10) * 60 + parseInt(get('minute'), 10);
      if (day === undefined || isNaN(mins)) throw new Error('time');
      return { day: day, mins: mins };
    } catch (e) {
      return { day: now.getDay(), mins: now.getHours() * 60 + now.getMinutes() };
    }
  }

  renderVals() {
    const s = this.state || {};
    const nb = ' ';
    const K = (v) => v + nb + 'Kč';
    const I = (name, price, desc, tip) => ({ name: name, price: price, desc: desc || '', hasDesc: !!desc, tip: !!tip });
    const G = (title, items, note) => ({ title: title, items: items, note: note || '', hasNote: !!note });
    const IG = (code) => 'https://www.instagram.com/gimmicafe/p/' + code + '/';

    // Doplňkové písmo (tweak)
    const fonts = {
      fraunces: { f: "'Fraunces', Georgia, serif", s: 'italic', k: '0.72' },
      pinyon: { f: "'Pinyon Script', cursive", s: 'normal', k: '0.92' },
      sacramento: { f: "'Sacramento', cursive", s: 'normal', k: '1' },
    };
    const acc = fonts[this.props.accentFont] || fonts.fraunces;

    // Otevírací doba, „právě otevřeno“ a pozdrav podle denní doby (pražský čas)
    const p = this.prague();
    const H = { 1: [450, 1140], 2: [450, 1140], 3: [450, 1140], 4: [450, 1140], 5: [450, 1140], 6: [510, 960] };
    const at = ['v neděli', 'v pondělí', 'v úterý', 've středu', 've čtvrtek', 'v pátek', 'v sobotu'];
    const fmt = (m) => Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
    const todayHours = H[p.day];
    let open = false;
    let statusText = 'Zavřeno';
    let statusShort = 'Zavřeno';
    if (todayHours && p.mins >= todayHours[0] && p.mins < todayHours[1]) {
      open = true;
      statusText = 'Právě otevřeno · do ' + fmt(todayHours[1]);
      statusShort = 'Otevřeno do ' + fmt(todayHours[1]);
    } else if (todayHours && p.mins < todayHours[0]) {
      statusText = 'Otevíráme dnes v ' + fmt(todayHours[0]);
      statusShort = 'Otevíráme v ' + fmt(todayHours[0]);
    } else {
      for (let i = 1; i <= 7; i++) {
        const d = (p.day + i) % 7;
        if (H[d]) {
          statusText = 'Zavřeno · otevíráme ' + (i === 1 ? 'zítra' : at[d]) + ' v ' + fmt(H[d][0]);
          break;
        }
      }
    }
    const hour = Math.floor(p.mins / 60);
    const greeting = hour < 11 ? 'Dobré ráno' : hour < 17 ? 'Krásné odpoledne' : 'Dobrý večer';
    const hours = [
      { label: 'Pondělí – pátek', time: '7:30 – 19:00', days: [1, 2, 3, 4, 5] },
      { label: 'Sobota', time: '8:30 – 16:00', days: [6] },
      { label: 'Neděle', time: 'zavřeno', days: [0] },
    ].map((r) => {
