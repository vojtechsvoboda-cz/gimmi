<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Gimmi – návrh nového webu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400&display=swap">
<link rel="stylesheet" href="pitch.css">
<style>
.home { min-height: 100vh; display: grid; align-content: center; gap: clamp(32px, 5vw, 56px); padding-block: clamp(40px, 7vw, 96px); }
.brand { display: grid; justify-items: center; gap: 10px; text-align: center; }
.brand h1 { font-size: clamp(34px, 4.4vw, 52px); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(16px, 2.4vw, 28px); max-width: 980px; width: 100%; margin: 0 auto; }
@media (max-width: 620px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
.tile { display: grid; gap: 14px; justify-items: center; color: var(--ink); text-decoration: none; }
.tile .card { width: 100%; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 22px; background: var(--paper); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; transition: transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s ease; }
.tile:hover .card { transform: translateY(-6px) scale(1.01); box-shadow: 0 34px 50px -34px rgba(42, 33, 27, 0.55); }
.tile span.l { font-size: 16px; font-weight: 600; letter-spacing: .01em; }
.tile:hover span.l { color: var(--green-ink); }
.tile .c-web { background: #EFE7D6; }
.c-web .frame { width: 74%; padding: 7px; background: var(--gold); box-shadow: 0 24px 34px -24px rgba(42,33,27,.7); transform: rotate(-1.5deg); }
.c-web .frame div { padding: 9px; background: var(--paper); }
.c-web img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
.tile .c-logo { background: var(--paper); }
.tile .c-admin { background: var(--green); }
.c-admin .ui { width: 76%; aspect-ratio: 16 / 10; display: grid; grid-template-columns: 26% 1fr; background: var(--paper-2); border-radius: 12px; overflow: hidden; box-shadow: 0 24px 36px -24px rgba(0,0,0,.45); }
.c-admin .ui .s { background: #E6E8D6; padding: 12px 8px; display: grid; gap: 7px; align-content: start; }
.c-admin .ui .s i { height: 7px; border-radius: 4px; background: #C9CDB0; }
.c-admin .ui .s i:first-child { background: var(--green); width: 74%; }
.c-admin .ui .m { padding: 12px; display: grid; gap: 8px; align-content: start; }
.c-admin .ui .m i { height: 18px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
.c-admin .ui .m i:nth-child(2) { width: 82%; }
.tile .c-price { background: #EFE7D6; }
.c-price .p { display: flex; gap: 10px; align-items: flex-end; }
.c-price .p i { display: block; width: clamp(48px, 9vw, 76px); border-radius: 10px; background: var(--paper-2); border: 1px solid var(--line); }
.c-price .p i:nth-child(1) { height: clamp(70px, 11vw, 100px); }
.c-price .p i:nth-child(2) { height: clamp(96px, 15vw, 136px); background: var(--green); border-color: var(--green); }
.c-price .p i:nth-child(3) { height: clamp(82px, 13vw, 118px); }
.by { text-align: center; font-size: 13px; color: var(--muted); }
.by a { color: var(--muted); }
</style>
</head>
<body>
<main class="wrap home">
<div class="brand">
<svg viewBox="0 0 100 104" width="40" height="42" aria-hidden="true"><g transform="rotate(-18 50 52)"><path d="M50 0A40 52 0 0 0 50 104C70 74 30 30 50 0Z" fill="#B5562E"></path><path d="M50 0A40 52 0 0 1 50 104C70 74 30 30 50 0Z" fill="#707A48"></path><path d="M50 0C30 30 70 74 50 104" fill="none" stroke="#F5EFE3" stroke-width="4"></path></g></svg>
<h1>Gimmi</h1>
</div>
<nav class="tiles" aria-label="Části návrhu">
<a class="tile" href="web.html"><span class="card c-web"><span class="frame"><div><img src="img/hero-tartaletky.jpg" alt=""></div></span></span><span class="l">Web</span></a>
<a class="tile" href="logo.html"><span class="card c-logo"><svg viewBox="0 0 100 104" width="96" height="100" aria-hidden="true"><g transform="rotate(-18 50 52)"><path d="M50 0A40 52 0 0 0 50 104C70 74 30 30 50 0Z" fill="#B5562E"></path><path d="M50 0A40 52 0 0 1 50 104C70 74 30 30 50 0Z" fill="#707A48"></path><path d="M50 0C30 30 70 74 50 104" fill="none" stroke="#FBF8F1" stroke-width="3"></path></g></svg></span><span class="l">Logo</span></a>
<a class="tile" href="admin.html"><span class="card c-admin"><span class="ui" aria-hidden="true"><span class="s"><i></i><i></i><i></i><i></i></span><span class="m"><i></i><i></i><i></i><i></i></span></span></span><span class="l">Administrace</span></a>
<a class="tile" href="balicky.html"><span class="card c-price"><span class="p" aria-hidden="true"><i></i><i></i><i></i></span></span><span class="l">Balíčky a ceny</span></a>
</nav>
<p class="by"><a href="https://vojtechsvoboda.cz" target="_blank" rel="noopener">vojtechsvoboda.cz</a></p>
</main>
</body>
</html>
